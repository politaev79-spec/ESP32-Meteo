; ESP32-C3 Super Mini + BMP280 — метеостанция
;
; PlatformIO
;   board = esp32-c3-devkitm-1  (подходит для ESP32-C3 Super Mini)
;   framework = arduino
;
; BMP280 по I2C. Пины настраиваются в include/config.h.

[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
upload_speed = 460800
board_build.mcu = esp32c3
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
; DS18B20 (KY-001) — 1-Wire (прямое чтение через SKIP ROM, как в примере)
lib_deps =
    paulstoffregen/OneWire
